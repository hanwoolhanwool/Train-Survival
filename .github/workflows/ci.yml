name: CI

# 문서·라이선스 파일만 바뀐 커밋에는 Unity 빌드를 돌리지 않는다.
# 한 번 실행에 LFS 를 약 892MB 쓰는데, 최근 실패의 상당수가 docs 커밋이었다.
# (paths-ignore 는 "변경된 파일이 전부 패턴에 걸릴 때"만 건너뛴다 —
#  코드가 한 파일이라도 섞이면 평소대로 돈다)
# (GitHub Actions 는 YAML 앵커를 지원하지 않아 목록을 양쪽에 그대로 적는다)
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'LICENSE-ASSETS'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'LICENSE-ASSETS'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (EditMode + PlayMode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      # restore-keys 에 잡 공통 접두어(Library-)를 두지 않는다.
      # 두면 build 잡이 test 잡의 linux-il2cpp Library 를 복원해(또는 그 반대) Unity 가 전량 재임포트한다.
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-test-

      # EditMode 가 게이트다 — 여기서 실패하면 워크플로가 실패한다.
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          artifactsPath: test-results

      # PlayMode 도 게이트다 (2026-09-04 격리 해제).
      #
      # 2026-08-31 ~ 09-03 에는 리눅스 컨테이너에서 PlayMode 진입 시 세그폴트(signo:11)로 죽어
      # continue-on-error 로 격리해 두었다. 원인은 이등분으로 잡았다 —
      # RailTrackMeshBuilder 의 [MenuItem] 등록 한 줄이었고, 리눅스 에디터에서만 등록을
      # 건너뛰도록 고쳤다 (자동화 1차 구현 계획 §1.8).
      - name: Run PlayMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: playmode
          artifactsPath: test-results-playmode

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-Results
          path: |
            test-results
            test-results-playmode

      # 실패했을 때 어떤 테스트가 죽었는지 로그 맨 끝에서 바로 보이게 한다.
      # 결과 XML 자체가 없으면 테스트가 시작되기도 전(라이선스·컴파일)에 실패한 것이다.
      - name: Summarize failed tests
        if: failure()
        run: |
          if ! ls test-results/*.xml >/dev/null 2>&1; then
            echo "::warning::테스트 결과 XML 이 없다 — 테스트가 시작되기 전(라이선스 활성화 또는 컴파일)에 실패했다."
            exit 0
          fi
          cat > "$RUNNER_TEMP/summarize-tests.js" <<'NODE_EOF'
          const fs = require('fs');
          const pattern = /<test-case\b[^>]*?result="Failed"[^>]*?(?:\/>|>([\s\S]*?)<\/test-case>)/g;
          let total = 0;
          for (const file of process.argv.slice(2)) {
            const xml = fs.readFileSync(file, 'utf8');
            let match;
            while ((match = pattern.exec(xml)) !== null) {
              const head = match[0].slice(0, match[0].indexOf('>') + 1);
              const name = (head.match(/\bfullname="([^"]*)"/) || head.match(/\bname="([^"]*)"/) || [, '(이름 없음)'])[1];
              const body = match[1] || '';
              const raw = (body.match(/<message>([\s\S]*?)<\/message>/) || [, ''])[1];
              const message = raw.replace(/<!\[CDATA\[|\]\]>/g, '').trim().split('\n')[0];
              total++;
              console.log(`::error::${name}${message ? ' — ' + message : ''}`);
            }
          }
          console.log(total === 0
            ? '실패로 기록된 테스트는 없다 — 잡 실패 원인은 테스트 바깥에 있다.'
            : `실패한 테스트 ${total}건.`);
          NODE_EOF
          node "$RUNNER_TEMP/summarize-tests.js" test-results/*.xml

      # 테스트 바깥에서(에디터 크래시로) 죽은 경우, 스택이 로그 맨 끝에서 바로 보이게 한다.
      # 2026-09-03 조사에서 14,000 줄 로그를 손으로 뒤져 찾은 일을 그대로 옮긴 것이다.
      #
      # always() 인 이유 — 크래시는 테스트 결과 XML 에 "실패"로 기록되지 않는다. 잡이 성공으로
      # 끝나는 경우(격리 중이거나, 크래시가 결과 집계 뒤에 나는 경우)에도 잡아야 한다.
      # 메뉴 항목을 새로 추가한 뒤 이 경고가 뜨면 §1.8 의 그 문제가 재발한 것이다.
      - name: Detect editor crash
        if: always()
        run: |
          found=0
          for log in test-results/*.log test-results-playmode/*.log; do
            [ -f "$log" ] || continue
            if grep -q "Caught fatal signal" "$log"; then
              found=1
              echo "::warning::에디터가 죽었다 — $log"
              grep -m1 -A 6 "Caught fatal signal" "$log" | while IFS= read -r line; do
                echo "::warning::$line"
              done
            fi
          done
          if [ "$found" = "0" ]; then
            echo "에디터 크래시 흔적 없음."
          fi

  build:
    name: Build (StandaloneWindows64)
    # needs: test 를 제거했다 (2026-09-03).
    # 두 잡은 Library 캐시 키가 이미 분리돼 있어 서로를 기다릴 기술적 이유가 없고,
    # 붙여 두면 테스트가 죽는 동안 "빌드는 되는가"를 아무도 모르게 된다 —
    # 2026-08-31 ~ 09-03 에 실제로 그랬다(build 잡이 나흘 내리 skipped).
    # "깨진 코드를 굽지 않는다"는 의도는 워크플로 실패 표시가 이미 수행한다.
    # 부수 효과로 벽시계가 17분 38초(순차) → 약 10분(병렬)으로 준다.
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — unity-builder 의 기본 versioning(Semantic)이 커밋 수를 세므로
      # 전체 히스토리가 필요하다. 없으면 액션이 스스로 --unshallow 를 돌려 시간만 더 쓴다.
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-build-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-build-

      # buildMethod 를 명시해 로컬 CLI 빌드와 CI 빌드가 같은 코드(BuildScript)를 타게 한다.
      # BuildScript 가 GameCI 의 -customBuildPath 를 읽으므로 산출물은 아래 업로드 경로에 그대로 떨어진다.
      - name: Build player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildMethod: Game.Editor.BuildScript.PerformWindowsBuild

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-StandaloneWindows64
          path: build/StandaloneWindows64
